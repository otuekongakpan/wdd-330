<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sleep Outside provides everything you need to sleep outside comfortably at an affordable price. Shop tents, backpacks, sleeping bags and more." />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="/css/style.css" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="/css/style.css" /></noscript>
    <script src="./js/main.js" type="module" defer></script>
  </head>

  <body>
    <header class="divider" role="banner" id="main-header"></header>
    

    <main class="divider" role="main">
      <div class="hero">
        <img
          src="/images/banner-sm.jpg"
          srcset="/images/banner-sm.jpg 500w, /images/banner.jpg 1080w"
          sizes="(max-width: 500px) 500px, 1080px"
          alt="High mountain lake with tents at sunset"
          decoding="async"
        />
        <div class="logo logo--square">
          <img src="/images/noun_Tent_2517.svg" alt="SleepOutside tent logo" width="90" height="90" decoding="async" />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep
            outside comfortably at an affordable price.
          </p>
        </div>
      </div>

      <section class="categories">
  <h2>Shop by Category</h2>
  <div class="category-grid">
    <a href="/product_listing/?category=tents" class="category-card">
      <img src="/images/category-tents.svg" alt="Tents" />
      <h3>Tents</h3>
    </a>
    <a href="/product_listing/?category=backpacks" class="category-card">
      <img src="/images/category-backpacks.svg" alt="Backpacks" />
      <h3>Backpacks</h3>
    </a>
    <a href="/product_listing/?category=sleeping-bags" class="category-card">
      <img src="/images/category-sleepingbags.svg" alt="Sleeping Bags" />
      <h3>Sleeping Bags</h3>
    </a>
    <a href="/product_listing/?category=hammocks" class="category-card">
      <img src="/images/category-hammocks.svg" alt="Hammocks" />
      <h3>Hammocks</h3>
    </a>
  </div>
</section>
    </main>

    <footer role="contentinfo" id="main-footer"></footer>
  </body>
</html>
